# Envoi unique de l'annonce d'ouverture à la liste d'attente (production),
# puis effacement de la collection listeAttente. À retirer une fois fait.
# Lancer d'abord sans « envoyer » : simulation, seulement des nombres.
name: Annonce d'ouverture (liste d'attente)

on:
  workflow_dispatch:
    inputs:
      envoyer:
        description: "Taper « oui » pour envoyer et effacer (sinon : simulation)"
        required: false
        default: "non"

permissions:
  contents: read
  id-token: write

jobs:
  annoncer:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installer les dépendances des fonctions
        working-directory: functions
        run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_DEPLOIEMENT }}
      - name: Annoncer
        env:
          ENVOYER: ${{ inputs.envoyer }}
          GCLOUD_PROJECT: snowro-app
        run: |
          RESEND_API_KEY="$(gcloud secrets versions access latest --secret=RESEND_API_KEY --project snowro-app)"
          echo "::add-mask::$RESEND_API_KEY"
          export RESEND_API_KEY
          node scripts/annonce-ouverture.mjs
