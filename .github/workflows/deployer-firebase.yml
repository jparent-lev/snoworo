# Déploie tout Snowro sur Firebase à chaque fusion dans main : le site
# (Firebase Hosting), les Cloud Functions, les règles et les index Firestore.
# Les fonctions inchangées sont sautées par la CLI Firebase.
# Authentification sans clé : Workload Identity Federation, limitée à la
# branche main de ce dépôt. Configuration unique côté Google Cloud :
# scripts/configurer-deploiement-ci.sh, puis deux variables de dépôt GitHub
# (Settings > Secrets and variables > Actions > Variables) :
#   GCP_WIF_PROVIDER    projects/<numéro>/locations/global/workloadIdentityPools/github/providers/snoworo
#   GCP_SA_DEPLOIEMENT  deploiement-github@snowro-app.iam.gserviceaccount.com
name: Déployer Snowro

on:
  push:
    branches: [main]
  # Lancement manuel (onglet Actions > Déployer Snowro > Run workflow).
  workflow_dispatch:

# Jamais deux déploiements en même temps ; un déploiement en cours n'est pas
# interrompu par le suivant.
concurrency:
  group: deployer-firebase
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deployer:
    # Ignoré (gris, pas rouge) tant que la configuration Google Cloud n'est
    # pas faite : voir l'en-tête de ce fichier.
    if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_DEPLOIEMENT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Configuration web lue dans .env.production ; version affichée dans le
      # pied de page = commit court (vite.config.js).
      - name: Construire le site
        run: |
          npm ci
          npm run build

      - name: Installer les dépendances des fonctions
        working-directory: functions
        run: npm ci

      - name: S'authentifier auprès de Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_DEPLOIEMENT }}

      - name: Déployer
        run: >-
          npx --yes firebase-tools@15
          deploy --only hosting,functions,firestore:rules,firestore:indexes
          --project snowro-app --non-interactive
