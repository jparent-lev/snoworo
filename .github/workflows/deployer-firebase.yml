# Déploie les Cloud Functions, les règles et les index Firestore à chaque
# fusion dans main qui touche ces fichiers (le site, lui, est déployé par
# Netlify). Authentification sans clé : Workload Identity Federation, limitée
# à la branche main de ce dépôt. Configuration unique côté Google Cloud :
# scripts/configurer-deploiement-ci.sh, puis deux variables de dépôt GitHub
# (Settings > Secrets and variables > Actions > Variables) :
#   GCP_WIF_PROVIDER    projects/<numéro>/locations/global/workloadIdentityPools/github/providers/snoworo
#   GCP_SA_DEPLOIEMENT  deploiement-github@snowro-app.iam.gserviceaccount.com
name: Déployer Firebase

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
  # Lancement manuel (onglet Actions > Déployer Firebase > Run workflow),
  # par exemple après avoir ajouté un secret.
  workflow_dispatch:

# Jamais deux déploiements en même temps ; un déploiement en cours n'est pas
# interrompu par le suivant.
concurrency:
  group: deployer-firebase
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deployer:
    # Ignoré (gris, pas rouge) tant que la configuration Google Cloud n'est
    # pas faite : voir l'en-tête de ce fichier.
    if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_DEPLOIEMENT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Installer les dépendances des fonctions
        working-directory: functions
        run: npm ci

      - name: S'authentifier auprès de Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_DEPLOIEMENT }}

      - name: Déployer
        run: >-
          npx --yes firebase-tools@15
          deploy --only functions,firestore:rules,firestore:indexes
          --project snowro-app --non-interactive
