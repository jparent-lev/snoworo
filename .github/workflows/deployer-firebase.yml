# Déploie tout Snowro sur Firebase : le site (Firebase Hosting), les Cloud
# Functions, les règles et les index Firestore. Les fonctions inchangées sont
# sautées par la CLI Firebase.
#   branche main  -> production (snowro-app, snowro.com)
#   branche test  -> environnement de test (snowro-test, test.snowro.com),
#                    site compilé avec .env.test (bandeau, noindex)
# Authentification sans clé : Workload Identity Federation, limitée à la
# branche de chaque environnement. Configuration unique côté Google Cloud :
# scripts/configurer-deploiement-ci.sh, puis deux variables de dépôt GitHub par
# environnement (Settings > Secrets and variables > Actions > Variables) :
#   GCP_WIF_PROVIDER, GCP_SA_DEPLOIEMENT            (production)
#   GCP_WIF_PROVIDER_TEST, GCP_SA_DEPLOIEMENT_TEST  (test)
name: Déployer Snowro

on:
  push:
    branches: [main, test]
  # Lancement manuel (onglet Actions > Déployer Snowro > Run workflow).
  workflow_dispatch:

# Jamais deux déploiements en même temps ; un déploiement en cours n'est pas
# interrompu par le suivant.
concurrency:
  group: deployer-firebase-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deployer:
    # Ignoré (gris, pas rouge) tant que la configuration Google Cloud n'est
    # pas faite : voir l'en-tête de ce fichier.
    if: >-
      (github.ref_name == 'main' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_DEPLOIEMENT != '') ||
      (github.ref_name == 'test' && vars.GCP_WIF_PROVIDER_TEST != '' && vars.GCP_SA_DEPLOIEMENT_TEST != '')
    runs-on: ubuntu-latest
    env:
      PROJET: ${{ github.ref_name == 'test' && 'snowro-test' || 'snowro-app' }}
      MODE_SITE: ${{ github.ref_name == 'test' && 'test' || 'production' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Configuration web lue dans .env.production ou .env.test ; version
      # affichée dans le pied de page = commit court (vite.config.js).
      - name: Construire le site
        run: |
          npm ci
          npm run build -- --mode "$MODE_SITE"

      - name: Installer les dépendances des fonctions
        working-directory: functions
        run: npm ci

      - name: S'authentifier auprès de Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ github.ref_name == 'test' && vars.GCP_WIF_PROVIDER_TEST || vars.GCP_WIF_PROVIDER }}
          service_account: ${{ github.ref_name == 'test' && vars.GCP_SA_DEPLOIEMENT_TEST || vars.GCP_SA_DEPLOIEMENT }}

      - name: Déployer
        run: >-
          npx --yes firebase-tools@15
          deploy --only hosting,functions,firestore:rules,firestore:indexes
          --project "$PROJET" --non-interactive
